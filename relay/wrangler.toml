# Deploy: npx wrangler deploy   (from this folder)
# Then:   npx wrangler secret put REVIEW_KIT_GITHUB_TOKEN
#         npx wrangler secret put REVIEW_KIT_REVIEWERS
name = "review-kit-relay"
main = "worker.ts"
compatibility_date = "2026-11-01"

