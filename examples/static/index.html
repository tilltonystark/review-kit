<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Review Kit demo</title>
  <style>
    body { font-family: Georgia, serif; margin: 0; background: #fbf7ef; color: #222; }
    header { background: #11243e; color: #fff; padding: 24px; }
    main { max-width: 720px; margin: 0 auto; padding: 32px 16px; }
    .card { background: #fff; border: 1px solid #ddd; border-radius: 12px; padding: 20px; margin: 16px 0; }
    button.cta { background: #ffd84d; border: 0; padding: 12px 20px; border-radius: 8px; font-size: 16px; }
  </style>
</head>
<body>
  <header><h1>Demo site</h1></header>
  <main>
    <section id="pricing" class="card">
      <h2>Pricing</h2>
      <p>One plan, simple price.</p>
      <a class="cta-link" href="/somewhere"><button class="cta">Sign up</button></a>
    </section>
    <form class="card"><label>Email <input type="email" value="me@example.com"></label></form>
  </main>
  <!-- Review Kit: one line. data-require-key="true" on a live site. -->
  <script type="module" src="/review-kit/review-kit.js" data-endpoint="/api/review-kit"></script>
</body>
</html>
